<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — آخر استخدام</title>
  <meta name="description" content="منصة «آخر استخدام» لتسجيل الممتلكات وتذكيرك بمواعيد استخدامها وانتهاء صلاحيتها واستبدالها.">
  <meta name="theme-color" content="#1f5a46">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
  <header id="app-header" class="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="auth-wrap">
      <div class="card auth-card">
        <img class="logo" src="assets/logo-mark.png" alt="" width="110" height="107">
        <h1 style="text-align:center">مرحبًا بك في «آخر استخدام»</h1>
        <p class="muted" style="text-align:center">لا تدع أغراضك تُنسى</p>
        <div class="auth-tabs" role="tablist" aria-label="نوع العملية">
          <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">تسجيل الدخول</button>
          <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form">إنشاء حساب</button>
        </div>
        <div id="mode-alert"></div>

        <form id="login-form" method="post" action="login.html" role="tabpanel" aria-labelledby="tab-login" class="stack" novalidate>
          <div class="field">
            <label for="login-username">اسم المستخدم</label>
            <input id="login-username" name="username" type="text" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false" required>
            <span class="error" data-for="username"></span>
          </div>
          <div class="field">
            <label for="login-password">كلمة المرور</label>
            <div class="pw-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" dir="ltr" required><button type="button" class="pw-toggle" aria-label="إظهار كلمة المرور">إظهار</button></div>
            <span class="error" data-for="password"></span>
          </div>
          <div class="alert alert-danger hidden" role="alert" id="login-error"></div>
          <button class="btn btn-primary btn-lg" type="submit" style="width:100%" disabled>دخول</button>
        </form>

        <form id="register-form" method="post" action="login.html" role="tabpanel" aria-labelledby="tab-register" class="stack hidden" novalidate>
          <p class="small muted">إنشاء الحساب فوري: الاسم واسم المستخدم وكلمة المرور فقط، دون بريد إلكتروني أو رقم جوال أو رمز تحقق.</p>
          <div class="field">
            <label for="reg-name">الاسم <span class="req">*</span></label>
            <input id="reg-name" name="full_name" type="text" autocomplete="name" maxlength="60" required>
            <span class="error" data-for="full_name"></span>
          </div>
          <div class="field">
            <label for="reg-username">اسم المستخدم <span class="req">*</span></label>
            <input id="reg-username" name="username" type="text" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false" maxlength="30" required aria-describedby="reg-username-hint">
            <span class="hint" id="reg-username-hint">٣–٣٠ حرفًا: حروف إنجليزية صغيرة وأرقام و _ و .</span>
            <span class="error" data-for="username"></span>
          </div>
          <div class="field">
            <label for="reg-password">كلمة المرور <span class="req">*</span></label>
            <div class="pw-wrap"><input id="reg-password" name="password" type="password" autocomplete="new-password" dir="ltr" minlength="8" required aria-describedby="reg-pw-hint"><button type="button" class="pw-toggle" aria-label="إظهار كلمة المرور">إظهار</button></div>
            <span class="hint" id="reg-pw-hint">٨ أحرف على الأقل.</span>
            <span class="error" data-for="password"></span>
          </div>
          <div class="field">
            <label for="reg-password2">تأكيد كلمة المرور <span class="req">*</span></label>
            <input id="reg-password2" name="password_confirm" type="password" autocomplete="new-password" dir="ltr" required>
            <span class="error" data-for="password_confirm"></span>
          </div>
          <div class="alert alert-danger hidden" role="alert" id="register-error"></div>
          <button class="btn btn-primary btn-lg" type="submit" style="width:100%" disabled>إنشاء الحساب</button>
        </form>
      </div>
    </div>
  </main>
  <footer id="app-footer"></footer>
  <script type="module" src="js/login.js"></script>
</body>
</html>
